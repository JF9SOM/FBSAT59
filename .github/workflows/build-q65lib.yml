name: Build q65lib Bundle

# Checks weekly for new WSJT-X releases that might touch the Q65 decode
# engine. Builds libq65 — WSJT-X's own Q65 decode engine (lib/q65_decode.f90),
# wrapped via scripts/wsjtx_bridge/q65wsjt_bridge.f90 — for all three
# platforms using scripts/build_q65lib.sh. Artifacts are stored in the
# dedicated "q65lib-bundle" pre-release tag.
# Also supports manual triggering for emergencies.

on:
  schedule:
    - cron: '0 10 * * 1'  # Every Monday 10:00 UTC (1 hour before ft4wsjt check)
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if version unchanged'
        required: false
        default: 'false'

jobs:
  # ------------------------------------------------------------------ #
  # Check whether a build is needed
  # ------------------------------------------------------------------ #
  check-version:
    name: Check WSJT-X / q65lib version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      wsjtx_tag: ${{ steps.check.outputs.wsjtx_tag }}
    steps:
      - name: Compare upstream vs bundled version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force_build }}
        run: |
          UPSTREAM=$(gh api repos/wsjtx/wsjtx/releases --jq '.[0].tag_name')
          echo "Upstream WSJT-X: $UPSTREAM"
          echo "wsjtx_tag=$UPSTREAM" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "Force build requested."
            exit 0
          fi

          CURRENT=""
          if gh release download q65lib-bundle \
               --repo "${{ github.repository }}" \
               --pattern "q65lib-linux-x86_64.tar.gz" \
               --dir /tmp/q65-check 2>/dev/null; then
            tar -xzf /tmp/q65-check/q65lib-linux-x86_64.tar.gz \
                -C /tmp/q65-check 2>/dev/null || true
            CURRENT=$(cat /tmp/q65-check/version.txt 2>/dev/null || echo "")
          fi

          echo "Bundled version: '$CURRENT'"
          if [ "$CURRENT" = "$UPSTREAM" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date — skipping build."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "Build needed: $UPSTREAM (have: '$CURRENT')"
          fi

  # ------------------------------------------------------------------ #
  # Linux
  # ------------------------------------------------------------------ #
  build-linux:
    name: Build q65lib (Linux)
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gfortran libfftw3-dev build-essential

      - name: Build libq65
        env:
          WSJTX_TAG: ${{ needs.check-version.outputs.wsjtx_tag }}
        run: |
          ARCH=$(uname -m)
          OUT_DIR=/tmp/q65lib-flat
          ./scripts/build_q65lib.sh "" "$OUT_DIR"
          echo "${WSJTX_TAG}" > "$OUT_DIR/version.txt"

          PKG_NAME="q65lib-linux-${ARCH}.tar.gz"
          tar -czf "/tmp/${PKG_NAME}" -C /tmp q65lib-flat
          echo "PKG=/tmp/${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"

      - name: Upload to q65lib-bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view q65lib-bundle \
            --repo "${{ github.repository }}" 2>/dev/null || \
          gh release create q65lib-bundle \
            --repo "${{ github.repository }}" \
            --title "Q65 Library Bundle" \
            --notes "Pre-built libq65 — WSJT-X's own Q65 decode engine, built from WSJT-X source." \
            --prerelease
          gh release upload q65lib-bundle \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ env.PKG }}"

  # ------------------------------------------------------------------ #
  # Windows
  # ------------------------------------------------------------------ #
  build-windows:
    name: Build q65lib (Windows)
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW gfortran
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> "$GITHUB_PATH"

      - name: Fetch FFTW3 headers (conda-forge via micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: q65lib-deps
          create-args: fftw
          channels: conda-forge
          init-shell: bash

      # micromamba's activation (from init-shell above) only takes effect in
      # a login bash shell, so this step needs `shell: bash -el {0}` instead
      # of the job-level plain `bash` default — same mechanism used in
      # build-ft4wsjt.yml.
      - name: Build q65.dll
        shell: bash -el {0}
        env:
          WSJTX_TAG: ${{ needs.check-version.outputs.wsjtx_tag }}
        run: |
          OUT_DIR="$RUNNER_TEMP/q65lib-flat"
          ./scripts/build_q65lib.sh "" "$OUT_DIR"
          echo "$WSJTX_TAG" > "$OUT_DIR/version.txt"
          # MinGW runtime DLLs needed by q65.dll
          for dll in libgcc_s_seh-1.dll libgfortran-5.dll libwinpthread-1.dll libquadmath-0.dll; do
            src="/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin/$dll"
            [ -f "$src" ] && cp "$src" "$OUT_DIR/"
          done
          # FFTW3 runtime DLL from the micromamba env (q65.dll dynamically
          # links against it).
          find "$CONDA_PREFIX/Library/bin" -iname "*fftw3f*.dll" -exec cp {} "$OUT_DIR/" \;
          PKG_NAME="q65lib-windows-x86_64.zip"
          (cd "$OUT_DIR" && 7z a "$RUNNER_TEMP/$PKG_NAME" .)
          echo "PKG=$RUNNER_TEMP/$PKG_NAME" >> "$GITHUB_ENV"
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"

      - name: Upload to q65lib-bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view q65lib-bundle \
            --repo "${{ github.repository }}" 2>/dev/null || \
          gh release create q65lib-bundle \
            --repo "${{ github.repository }}" \
            --title "Q65 Library Bundle" \
            --notes "Pre-built libq65 for Q65 EME decoding." \
            --prerelease
          gh release upload q65lib-bundle \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ env.PKG }}"

  # ------------------------------------------------------------------ #
  # macOS
  # ------------------------------------------------------------------ #
  build-macos:
    name: Build q65lib (macOS)
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gfortran + FFTW3
        run: brew install gcc fftw

      - name: Build libq65
        env:
          WSJTX_TAG: ${{ needs.check-version.outputs.wsjtx_tag }}
        run: |
          ARCH=$(uname -m)
          OUT_DIR=/tmp/q65lib-flat
          FC=$(ls $(brew --prefix gcc)/bin/gfortran-* 2>/dev/null | head -1)
          FC=${FC:-gfortran} ./scripts/build_q65lib.sh "" "$OUT_DIR"
          echo "${WSJTX_TAG}" > "$OUT_DIR/version.txt"

          PKG_NAME="q65lib-macos-${ARCH}.tar.gz"
          tar -czf "/tmp/${PKG_NAME}" -C /tmp q65lib-flat
          echo "PKG=/tmp/${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"

      - name: Upload to q65lib-bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view q65lib-bundle \
            --repo "${{ github.repository }}" 2>/dev/null || \
          gh release create q65lib-bundle \
            --repo "${{ github.repository }}" \
            --title "Q65 Library Bundle" \
            --notes "Pre-built libq65 for Q65 EME decoding." \
            --prerelease
          gh release upload q65lib-bundle \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ env.PKG }}"
