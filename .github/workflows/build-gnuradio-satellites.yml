name: Build gr-satellites Bundle

# Packs a headless (no Qt/GUI) conda-forge environment containing
# gnuradio-core + gnuradio-satellites with conda-pack, so users don't have
# to install the full GNU Radio toolchain (and its ~59 Homebrew/apt
# dependencies) themselves just to decode satellite telemetry. Artifacts are
# uploaded to the dedicated "gr-satellites-bundle" pre-release tag, mirroring
# the ft8lib/q65lib/ft4wsjt bundle workflows.
#
# macOS + Linux + Windows, all three verified green 2026-07-31. Windows
# conda envs lay out gr_satellites very differently from macOS/Linux — it's
# under Library/bin/ (the conda-forge convention for GNU Radio OOT modules,
# not Scripts/, which is reserved for pure-Python console-script entry
# points) as a plain gr_satellites.py script, invoked via the bundled
# python.exe exactly like the macOS/Linux bin/gr_satellites case; see
# gr_satellites_install.py's module docstring for the full story. Manual
# trigger only (no schedule) — add one once this has been relied on for a
# while without needing further fixes.

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build gr-satellites env (macOS arm64)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create headless gr-satellites conda-forge env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gr-satellites-env
          create-args: >-
            gnuradio-core
            gnuradio-satellites
            python=3.11
          channels: conda-forge
          init-shell: bash

      # gnuradio-core alone has no Qt/PyQt dependency, and gnuradio-satellites
      # depends only on gnuradio-core + gnuradio-pmt + gnuradio-zeromq (not
      # gnuradio-qtgui) — confirmed via the conda-forge feedstock metadata.
      # Not pinning any GUI package here is what keeps this small.
      - name: Pack environment with conda-pack
        shell: bash -el {0}
        run: |
          pip install conda-pack
          ENV_PREFIX="${MAMBA_ROOT_PREFIX}/envs/gr-satellites-env"
          PKG_NAME="gr-satellites-macos-arm64.tar.gz"
          conda-pack -p "$ENV_PREFIX" -o "/tmp/${PKG_NAME}"
          echo "PKG=/tmp/${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"
          ls -lh "/tmp/${PKG_NAME}"

      # Extracts to a location different from where it was built (the whole
      # point of conda-pack), runs conda-unpack to fix up prefixes, and
      # verifies the CLI + Python import both work — this is the step that
      # actually proves the "download a portable env" approach is viable
      # for something as large as GNU Radio, which has not been tried in
      # this project before.
      #
      # 2026-07-31 investigation (resolved): a first run failed with
      # "ModuleNotFoundError: No module named 'gnuradio'" from
      # gr_satellites' own "from gnuradio import gr, blocks, audio" line.
      # Detailed diagnostics from a second run showed the *relocated*
      # python (invoked explicitly) correctly imports both "gnuradio" and,
      # once corrected, "satellites" (gr-satellites installs as a top-level
      # "satellites" package, not "gnuradio.satellites" — confirmed by
      # downloading and inspecting the actual .conda file directly) — so
      # site-packages resolution and conda-unpack both work fine. The
      # actual bug: gr_satellites' shebang is "#!/usr/bin/env python", with
      # no absolute path for conda-unpack to rewrite, so invoking the
      # script directly picks up whatever "python" is first on the
      # *caller's* PATH rather than the bundled interpreter. Fixed at the
      # application level (gr_satellites_install.py's
      # resolve_gr_satellites_command() always invokes the bundled python
      # explicitly) and mirrored here so the smoke test matches how the
      # app actually launches it.
      - name: Smoke-test packed environment
        run: |
          set +e
          STATUS=0
          SP=/tmp/gr-sat-smoketest/lib/python3.11/site-packages

          mkdir -p /tmp/gr-sat-smoketest
          tar -xzf "${{ env.PKG }}" -C /tmp/gr-sat-smoketest

          echo "=== bin/ python binaries/symlinks ==="
          ls -la /tmp/gr-sat-smoketest/bin/ | grep -i python

          echo
          echo "=== site-packages/gnuradio + satellites BEFORE conda-unpack ==="
          ls -la "$SP" 2>&1 | grep -iE "gnuradio|satellites" || echo "(not found)"

          echo
          echo "=== gr_satellites shebang BEFORE conda-unpack ==="
          head -1 /tmp/gr-sat-smoketest/bin/gr_satellites

          echo
          echo "=== Running conda-unpack ==="
          /tmp/gr-sat-smoketest/bin/python /tmp/gr-sat-smoketest/bin/conda-unpack
          echo "conda-unpack exit code: $?"

          echo
          echo "=== gr_satellites shebang AFTER conda-unpack ==="
          head -1 /tmp/gr-sat-smoketest/bin/gr_satellites

          echo
          echo "=== site-packages/gnuradio + satellites AFTER conda-unpack ==="
          ls -la "$SP" 2>&1 | grep -iE "gnuradio|satellites" || echo "(not found)"

          echo
          echo "=== Relocated python: executable / prefix / exec_prefix / sys.path ==="
          /tmp/gr-sat-smoketest/bin/python -c "import sys; print('executable:', sys.executable); print('prefix:', sys.prefix); print('exec_prefix:', sys.exec_prefix); print('path:'); [print(' ', p) for p in sys.path]"

          echo
          echo "=== Control: import numpy (non-gnuradio package, same site-packages) ==="
          /tmp/gr-sat-smoketest/bin/python -c "import numpy; print('numpy OK:', numpy.__file__)"
          if [ $? -ne 0 ]; then echo "numpy import FAILED"; STATUS=1; fi

          echo
          echo "=== Test: import gnuradio ==="
          /tmp/gr-sat-smoketest/bin/python -c "import gnuradio; print('gnuradio OK, __path__:', list(gnuradio.__path__))"
          if [ $? -ne 0 ]; then echo "gnuradio import FAILED"; STATUS=1; fi

          # gr-satellites installs as a top-level "satellites" package (not
          # gnuradio.satellites) — confirmed by downloading and inspecting
          # the actual .conda package's file listing directly.
          echo
          echo "=== Test: import satellites ==="
          /tmp/gr-sat-smoketest/bin/python -c "import satellites; print('satellites OK, __path__:', list(satellites.__path__))"
          if [ $? -ne 0 ]; then echo "satellites import FAILED"; STATUS=1; fi

          # Informational only (does not affect STATUS): gr_satellites' own
          # shebang is "#!/usr/bin/env python" — no absolute path for
          # conda-unpack to rewrite — so invoking it directly depends on
          # whatever "python" is first on *this shell's* PATH, not the
          # bundled one. This is expected to differ from the explicit-python
          # invocation below; both are shown so the gap stays visible over
          # time rather than being "fixed" by accident (e.g. a runner image
          # change) without anyone noticing.
          echo
          echo "=== Informational: gr_satellites --version via its own shebang ==="
          /tmp/gr-sat-smoketest/bin/gr_satellites --version > /dev/null 2>&1
          echo "exit code: $? (expected to fail — PATH-dependent shebang, not a real bug)"

          # gr_satellites requires a satellite (NORAD ID/name/YAML path) as
          # its first positional argument for everything except --version
          # and --list_satellites (see its own main(): any other leading
          # "-..." flag, including a bare --help, hits
          # "sys.exit(1)" after printing just the usage line — that is
          # correct, by-design behavior for this CLI, not a bug in the
          # bundle. --version is the right "does this run at all" check
          # since it needs no satellite argument. The real app
          # (gr_satellites_backend.py) always calls this with the NORAD ID
          # as sys.argv[1], i.e. the normal invocation form, so it was never
          # affected by this either way.
          echo
          echo "=== Test: gr_satellites --version via explicit bundled python (real invocation) ==="
          /tmp/gr-sat-smoketest/bin/python /tmp/gr-sat-smoketest/bin/gr_satellites --version
          if [ $? -ne 0 ]; then echo "gr_satellites --version (explicit python) FAILED"; STATUS=1; fi

          echo
          if [ "$STATUS" -eq 0 ]; then
            echo "Smoke test passed."
          else
            echo "Smoke test FAILED — see diagnostics above."
          fi
          exit $STATUS

      - name: Upload to gr-satellites-bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view gr-satellites-bundle \
            --repo "${{ github.repository }}" 2>/dev/null || \
          gh release create gr-satellites-bundle \
            --repo "${{ github.repository }}" \
            --title "gr-satellites Bundle" \
            --notes "Pre-built, headless (no Qt/GUI) GNU Radio + gr-satellites conda-forge environment, packed with conda-pack." \
            --prerelease
          gh release upload gr-satellites-bundle \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ env.PKG }}"

  # ------------------------------------------------------------------ #
  # Linux
  # ------------------------------------------------------------------ #
  build-linux:
    name: Build gr-satellites env (Linux x86_64)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create headless gr-satellites conda-forge env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gr-satellites-env
          create-args: >-
            gnuradio-core
            gnuradio-satellites
            python=3.11
          channels: conda-forge
          init-shell: bash

      - name: Pack environment with conda-pack
        shell: bash -el {0}
        run: |
          pip install conda-pack
          ENV_PREFIX="${MAMBA_ROOT_PREFIX}/envs/gr-satellites-env"
          PKG_NAME="gr-satellites-linux-x86_64.tar.gz"
          conda-pack -p "$ENV_PREFIX" -o "/tmp/${PKG_NAME}"
          echo "PKG=/tmp/${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"
          ls -lh "/tmp/${PKG_NAME}"

      # Same checks as the macOS job (see its comments for the two real
      # bugs those diagnostics found: neither was Linux/macOS-specific, so
      # this is expected to just work — but verifying rather than assuming).
      - name: Smoke-test packed environment
        run: |
          set +e
          STATUS=0
          SP=/tmp/gr-sat-smoketest/lib/python3.11/site-packages

          mkdir -p /tmp/gr-sat-smoketest
          tar -xzf "${{ env.PKG }}" -C /tmp/gr-sat-smoketest

          echo "=== bin/ python binaries/symlinks ==="
          ls -la /tmp/gr-sat-smoketest/bin/ | grep -i python

          echo
          echo "=== site-packages/gnuradio + satellites BEFORE conda-unpack ==="
          ls -la "$SP" 2>&1 | grep -iE "gnuradio|satellites" || echo "(not found)"

          echo
          echo "=== Running conda-unpack ==="
          /tmp/gr-sat-smoketest/bin/python /tmp/gr-sat-smoketest/bin/conda-unpack
          echo "conda-unpack exit code: $?"

          echo
          echo "=== site-packages/gnuradio + satellites AFTER conda-unpack ==="
          ls -la "$SP" 2>&1 | grep -iE "gnuradio|satellites" || echo "(not found)"

          echo
          echo "=== Control: import numpy (non-gnuradio package, same site-packages) ==="
          /tmp/gr-sat-smoketest/bin/python -c "import numpy; print('numpy OK:', numpy.__file__)"
          if [ $? -ne 0 ]; then echo "numpy import FAILED"; STATUS=1; fi

          echo
          echo "=== Test: import gnuradio ==="
          /tmp/gr-sat-smoketest/bin/python -c "import gnuradio; print('gnuradio OK, __path__:', list(gnuradio.__path__))"
          if [ $? -ne 0 ]; then echo "gnuradio import FAILED"; STATUS=1; fi

          echo
          echo "=== Test: import satellites ==="
          /tmp/gr-sat-smoketest/bin/python -c "import satellites; print('satellites OK, __path__:', list(satellites.__path__))"
          if [ $? -ne 0 ]; then echo "satellites import FAILED"; STATUS=1; fi

          echo
          echo "=== Test: gr_satellites --version via explicit bundled python (real invocation) ==="
          /tmp/gr-sat-smoketest/bin/python /tmp/gr-sat-smoketest/bin/gr_satellites --version
          if [ $? -ne 0 ]; then echo "gr_satellites --version (explicit python) FAILED"; STATUS=1; fi

          echo
          if [ "$STATUS" -eq 0 ]; then
            echo "Smoke test passed."
          else
            echo "Smoke test FAILED — see diagnostics above."
          fi
          exit $STATUS

      - name: Upload to gr-satellites-bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view gr-satellites-bundle \
            --repo "${{ github.repository }}" 2>/dev/null || \
          gh release create gr-satellites-bundle \
            --repo "${{ github.repository }}" \
            --title "gr-satellites Bundle" \
            --notes "Pre-built, headless (no Qt/GUI) GNU Radio + gr-satellites conda-forge environment, packed with conda-pack." \
            --prerelease
          gh release upload gr-satellites-bundle \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ env.PKG }}"

  # ------------------------------------------------------------------ #
  # Windows
  # ------------------------------------------------------------------ #
  build-windows:
    name: Build gr-satellites env (Windows x86_64)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create headless gr-satellites conda-forge env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gr-satellites-env
          create-args: >-
            gnuradio-core
            gnuradio-satellites
            python=3.11
          channels: conda-forge
          init-shell: bash

      # $RUNNER_TEMP is a native Windows path (e.g. "D:\a\_temp"). Naively
      # concatenating "/something" onto it (as the macOS/Linux jobs do with
      # their own /tmp-based paths) produces a *mixed*-separator path like
      # "D:\a\_temp/file" that later broke "tar -xzf" (see the Smoke-test
      # step's comment) — bsdtar's hostname:path remote-archive syntax
      # treats the leading "D:" as a hostname, not a drive letter, once the
      # rest of the path isn't a clean backslash form it recognizes.
      # cygpath -u converts it to a POSIX-style path once here
      # ("/d/a/_temp") and every subsequent step (including Smoke-test and
      # Upload) inherits that same, unambiguous form via $PKG.
      - name: Pack environment with conda-pack
        shell: bash -el {0}
        run: |
          pip install conda-pack
          ENV_PREFIX="${MAMBA_ROOT_PREFIX}/envs/gr-satellites-env"
          WIN_TMP="$(cygpath -u "$RUNNER_TEMP")"
          PKG_NAME="gr-satellites-windows-x86_64.tar.gz"
          conda-pack -p "$ENV_PREFIX" -o "$WIN_TMP/${PKG_NAME}"
          echo "PKG=$WIN_TMP/${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"
          ls -lh "$WIN_TMP/${PKG_NAME}"

      # 2026-07-31 investigation (resolved): the first Windows run's
      # informational launcher check ("Scripts/gr_satellites.exe --version")
      # failed with "No such file or directory" — Scripts/ only contained
      # conda-unpack, not gr_satellites at all. Downloading and inspecting
      # the actual win-64 gnuradio-satellites .conda package directly
      # explained why: unlike Scripts/ (pure-Python console-script entry
      # points only), GNU Radio OOT modules are C/C++-oriented packages by
      # conda-forge convention, and their executables live under
      # Library/bin/ instead — Library/bin/gr_satellites.py (plain script,
      # used below) alongside Library/bin/gr_satellites.exe (a launcher
      # stub, deliberately not used, matching the macOS/Linux precedent of
      # not trusting bundled launchers/shebangs). python.exe at the env
      # root and Scripts/conda-unpack.exe were both already confirmed
      # correct in that same run.
      - name: Smoke-test packed environment
        run: |
          set +e
          STATUS=0
          # Same cygpath fix as the Pack step above — $RUNNER_TEMP is a
          # native Windows path in this (separate) step's shell too, since
          # plain bash variables don't carry over between steps.
          EXTRACT_DIR="$(cygpath -u "$RUNNER_TEMP")/gr-sat-smoketest"
          SP="$EXTRACT_DIR/Lib/site-packages"
          GR_SAT_SCRIPT="$EXTRACT_DIR/Library/bin/gr_satellites.py"

          mkdir -p "$EXTRACT_DIR"
          tar -xzf "${{ env.PKG }}" -C "$EXTRACT_DIR"

          echo "=== Library/bin/ entries mentioning satellite ==="
          ls -la "$EXTRACT_DIR/Library/bin" 2>&1 | grep -i satellite || echo "(not found under Library/bin/)"

          echo
          echo "=== site-packages/gnuradio + satellites BEFORE conda-unpack ==="
          ls -la "$SP" 2>&1 | grep -iE "gnuradio|satellites" || echo "(not found)"

          echo
          echo "=== Running conda-unpack ==="
          # Scripts/conda-unpack.exe is a self-contained launcher stub
          # (Windows console-script entry point), not text with a shebang
          # like macOS/Linux's bin/conda-unpack — run it directly rather
          # than handing it to python.exe as an argument (that would try to
          # parse the .exe's binary content as Python source).
          "$EXTRACT_DIR/Scripts/conda-unpack.exe"
          echo "conda-unpack exit code: $?"

          echo
          echo "=== Control: import numpy (non-gnuradio package, same site-packages) ==="
          "$EXTRACT_DIR/python.exe" -c "import numpy; print('numpy OK:', numpy.__file__)"
          if [ $? -ne 0 ]; then echo "numpy import FAILED"; STATUS=1; fi

          echo
          echo "=== Test: import gnuradio ==="
          "$EXTRACT_DIR/python.exe" -c "import gnuradio; print('gnuradio OK, __path__:', list(gnuradio.__path__))"
          if [ $? -ne 0 ]; then echo "gnuradio import FAILED"; STATUS=1; fi

          echo
          echo "=== Test: import satellites ==="
          "$EXTRACT_DIR/python.exe" -c "import satellites; print('satellites OK, __path__:', list(satellites.__path__))"
          if [ $? -ne 0 ]; then echo "satellites import FAILED"; STATUS=1; fi

          echo
          echo "=== Test: gr_satellites --version via explicit bundled python (real invocation) ==="
          "$EXTRACT_DIR/python.exe" "$GR_SAT_SCRIPT" --version
          if [ $? -ne 0 ]; then echo "gr_satellites --version (explicit python) FAILED"; STATUS=1; fi

          echo
          if [ "$STATUS" -eq 0 ]; then
            echo "Smoke test passed."
          else
            echo "Smoke test FAILED — see diagnostics above."
          fi
          exit $STATUS

      - name: Upload to gr-satellites-bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view gr-satellites-bundle \
            --repo "${{ github.repository }}" 2>/dev/null || \
          gh release create gr-satellites-bundle \
            --repo "${{ github.repository }}" \
            --title "gr-satellites Bundle" \
            --notes "Pre-built, headless (no Qt/GUI) GNU Radio + gr-satellites conda-forge environment, packed with conda-pack." \
            --prerelease
          gh release upload gr-satellites-bundle \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ env.PKG }}"
