name: Build gr-satellites Bundle

# Packs a headless (no Qt/GUI) conda-forge environment containing
# gnuradio-core + gnuradio-satellites with conda-pack, so users don't have
# to install the full GNU Radio toolchain (and its ~59 Homebrew/apt
# dependencies) themselves just to decode satellite telemetry. Artifacts are
# uploaded to the dedicated "gr-satellites-bundle" pre-release tag, mirroring
# the ft8lib/q65lib/ft4wsjt bundle workflows.
#
# macOS-only for now (Windows/Linux jobs to follow once this is verified to
# actually work end-to-end — conda-pack relocation of a package as large as
# GNU Radio has not been tried in this project before). Manual trigger only
# (no schedule) until a successful run has been confirmed.

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build gr-satellites env (macOS arm64)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create headless gr-satellites conda-forge env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gr-satellites-env
          create-args: >-
            gnuradio-core
            gnuradio-satellites
            python=3.11
          channels: conda-forge
          init-shell: bash

      # gnuradio-core alone has no Qt/PyQt dependency, and gnuradio-satellites
      # depends only on gnuradio-core + gnuradio-pmt + gnuradio-zeromq (not
      # gnuradio-qtgui) — confirmed via the conda-forge feedstock metadata.
      # Not pinning any GUI package here is what keeps this small.
      - name: Pack environment with conda-pack
        shell: bash -el {0}
        run: |
          pip install conda-pack
          ENV_PREFIX="${MAMBA_ROOT_PREFIX}/envs/gr-satellites-env"
          PKG_NAME="gr-satellites-macos-arm64.tar.gz"
          conda-pack -p "$ENV_PREFIX" -o "/tmp/${PKG_NAME}"
          echo "PKG=/tmp/${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"
          ls -lh "/tmp/${PKG_NAME}"

      # Extracts to a location different from where it was built (the whole
      # point of conda-pack), runs conda-unpack to fix up prefixes, and
      # verifies the CLI + Python import both work — this is the step that
      # actually proves the "download a portable env" approach is viable
      # for something as large as GNU Radio, which has not been tried in
      # this project before.
      #
      # 2026-07-31: a first run got past packing/extraction/conda-unpack
      # cleanly but "gr_satellites --help" failed with
      # "ModuleNotFoundError: No module named 'gnuradio'" — even though the
      # gnuradio-core package (confirmed by downloading and inspecting the
      # actual .conda file) does contain gnuradio/gr, gnuradio/blocks,
      # gnuradio/audio etc. under lib/python3.11/site-packages/. That rules
      # out a missing-package explanation; the remaining candidates are a
      # conda-unpack/relocation bug specific to this environment. Rather
      # than guess further, this step now runs every diagnostic in one pass
      # (not aborting on the first failure) so a single re-run gives a full
      # picture: shebang before/after conda-unpack, whether gnuradio/ is
      # physically present in site-packages, the relocated python's own
      # sys.path, and a control import (numpy) to tell "nothing in
      # site-packages resolves" apart from "something gnuradio-specific".
      - name: Smoke-test packed environment
        run: |
          set +e
          STATUS=0
          SP=/tmp/gr-sat-smoketest/lib/python3.11/site-packages

          mkdir -p /tmp/gr-sat-smoketest
          tar -xzf "${{ env.PKG }}" -C /tmp/gr-sat-smoketest

          echo "=== bin/ python binaries/symlinks ==="
          ls -la /tmp/gr-sat-smoketest/bin/ | grep -i python

          echo
          echo "=== site-packages/gnuradio BEFORE conda-unpack ==="
          ls -la "$SP" 2>&1 | grep -i gnuradio || echo "(not found)"

          echo
          echo "=== gr_satellites shebang BEFORE conda-unpack ==="
          head -1 /tmp/gr-sat-smoketest/bin/gr_satellites

          echo
          echo "=== Running conda-unpack ==="
          /tmp/gr-sat-smoketest/bin/python /tmp/gr-sat-smoketest/bin/conda-unpack
          echo "conda-unpack exit code: $?"

          echo
          echo "=== gr_satellites shebang AFTER conda-unpack ==="
          head -1 /tmp/gr-sat-smoketest/bin/gr_satellites

          echo
          echo "=== site-packages/gnuradio AFTER conda-unpack ==="
          ls -la "$SP" 2>&1 | grep -i gnuradio || echo "(not found)"

          echo
          echo "=== Relocated python: executable / prefix / exec_prefix / sys.path ==="
          /tmp/gr-sat-smoketest/bin/python -c "import sys; print('executable:', sys.executable); print('prefix:', sys.prefix); print('exec_prefix:', sys.exec_prefix); print('path:'); [print(' ', p) for p in sys.path]"

          echo
          echo "=== Control: import numpy (non-gnuradio package, same site-packages) ==="
          /tmp/gr-sat-smoketest/bin/python -c "import numpy; print('numpy OK:', numpy.__file__)"
          if [ $? -ne 0 ]; then echo "numpy import FAILED"; STATUS=1; fi

          echo
          echo "=== Test: import gnuradio ==="
          /tmp/gr-sat-smoketest/bin/python -c "import gnuradio; print('gnuradio OK, __path__:', list(gnuradio.__path__))"
          if [ $? -ne 0 ]; then echo "gnuradio import FAILED"; STATUS=1; fi

          echo
          echo "=== Test: import gnuradio.satellites ==="
          /tmp/gr-sat-smoketest/bin/python -c "import gnuradio.satellites; print('gnuradio.satellites OK')"
          if [ $? -ne 0 ]; then echo "gnuradio.satellites import FAILED"; STATUS=1; fi

          echo
          echo "=== Test: gr_satellites --help (own shebang) ==="
          /tmp/gr-sat-smoketest/bin/gr_satellites --help
          if [ $? -ne 0 ]; then echo "gr_satellites --help FAILED"; STATUS=1; fi

          echo
          if [ "$STATUS" -eq 0 ]; then
            echo "Smoke test passed."
          else
            echo "Smoke test FAILED — see diagnostics above."
          fi
          exit $STATUS

      - name: Upload to gr-satellites-bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view gr-satellites-bundle \
            --repo "${{ github.repository }}" 2>/dev/null || \
          gh release create gr-satellites-bundle \
            --repo "${{ github.repository }}" \
            --title "gr-satellites Bundle" \
            --notes "Pre-built, headless (no Qt/GUI) GNU Radio + gr-satellites conda-forge environment, packed with conda-pack." \
            --prerelease
          gh release upload gr-satellites-bundle \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ env.PKG }}"
