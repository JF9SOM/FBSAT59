name: Build ft4wsjt Bundle

# Checks weekly for new WSJT-X releases that might touch the FT4 decode
# engine. Builds libft4wsjt — WSJT-X's own FT4 decode engine (3-pass
# subtract + BP/OSD), wrapped via scripts/wsjtx_bridge/ — for all three
# platforms using scripts/build_ft4wsjt.sh. Artifacts are stored in the
# dedicated "ft4wsjt-bundle" pre-release tag.
# Also supports manual triggering for emergencies.

on:
  schedule:
    - cron: '0 11 * * 1'  # Every Monday 11:00 UTC (1 hour after q65lib check)
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if version unchanged'
        required: false
        default: 'false'

jobs:
  # ------------------------------------------------------------------ #
  # Check whether a build is needed
  # ------------------------------------------------------------------ #
  check-version:
    name: Check WSJT-X / ft4wsjt version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      wsjtx_tag: ${{ steps.check.outputs.wsjtx_tag }}
    steps:
      - name: Compare upstream vs bundled version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force_build }}
        run: |
          UPSTREAM=$(gh api repos/wsjtx/wsjtx/releases --jq '.[0].tag_name')
          echo "Upstream WSJT-X: $UPSTREAM"
          echo "wsjtx_tag=$UPSTREAM" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "Force build requested."
            exit 0
          fi

          CURRENT=""
          if gh release download ft4wsjt-bundle \
               --repo "${{ github.repository }}" \
               --pattern "ft4wsjt-linux-x86_64.tar.gz" \
               --dir /tmp/ft4wsjt-check 2>/dev/null; then
            tar -xzf /tmp/ft4wsjt-check/ft4wsjt-linux-x86_64.tar.gz \
                -C /tmp/ft4wsjt-check 2>/dev/null || true
            CURRENT=$(cat /tmp/ft4wsjt-check/version.txt 2>/dev/null || echo "")
          fi

          echo "Bundled version: '$CURRENT'"
          if [ "$CURRENT" = "$UPSTREAM" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date — skipping build."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "Build needed: $UPSTREAM (have: '$CURRENT')"
          fi

  # ------------------------------------------------------------------ #
  # Linux
  # ------------------------------------------------------------------ #
  build-linux:
    name: Build ft4wsjt (Linux)
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gfortran libfftw3-dev libboost-dev build-essential

      - name: Build libft4wsjt
        env:
          WSJTX_TAG: ${{ needs.check-version.outputs.wsjtx_tag }}
        run: |
          ARCH=$(uname -m)
          OUT_DIR=/tmp/ft4wsjt-flat
          ./scripts/build_ft4wsjt.sh "" "$OUT_DIR"
          echo "${WSJTX_TAG}" > "$OUT_DIR/version.txt"

          PKG_NAME="ft4wsjt-linux-${ARCH}.tar.gz"
          tar -czf "/tmp/${PKG_NAME}" -C /tmp ft4wsjt-flat
          echo "PKG=/tmp/${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"

      - name: Upload to ft4wsjt-bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ft4wsjt-bundle \
            --repo "${{ github.repository }}" 2>/dev/null || \
          gh release create ft4wsjt-bundle \
            --repo "${{ github.repository }}" \
            --title "FT4 Enhanced Decoder (libft4wsjt) Bundle" \
            --notes "Pre-built libft4wsjt — WSJT-X's own FT4 decode engine (3-pass subtract + BP/OSD), built from WSJT-X source." \
            --prerelease
          gh release upload ft4wsjt-bundle \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ env.PKG }}"

  # ------------------------------------------------------------------ #
  # Windows
  # ------------------------------------------------------------------ #
  build-windows:
    name: Build ft4wsjt (Windows)
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW gfortran
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> "$GITHUB_PATH"

      - name: Fetch FFTW3 + Boost headers (conda-forge via micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ft4wsjt-deps
          create-args: fftw boost
          channels: conda-forge
          init-shell: bash

      # micromamba's activation (from init-shell above) only takes effect in
      # a login bash shell, so this step — and only this step — needs
      # `shell: bash -el {0}` instead of the job-level plain `bash` default.
      # That activation is what sets $CONDA_PREFIX, which
      # build_ft4wsjt.sh's own directory-scanning logic already knows to
      # check (see FFTW3_F03_DIR / BOOST_INCLUDE_DIR in the script) — same
      # mechanism as the Linux/macOS jobs, just via micromamba instead of
      # apt/brew.
      - name: Build ft4wsjt.dll
        shell: bash -el {0}
        env:
          WSJTX_TAG: ${{ needs.check-version.outputs.wsjtx_tag }}
        run: |
          OUT_DIR="$RUNNER_TEMP/ft4wsjt-flat"
          ./scripts/build_ft4wsjt.sh "" "$OUT_DIR"
          echo "$WSJTX_TAG" > "$OUT_DIR/version.txt"
          # MinGW runtime DLLs needed by ft4wsjt.dll
          for dll in libgcc_s_seh-1.dll libgfortran-5.dll libwinpthread-1.dll libstdc++-6.dll; do
            src="/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin/$dll"
            [ -f "$src" ] && cp "$src" "$OUT_DIR/"
          done
          # FFTW3 runtime DLL from the micromamba env (ft4wsjt.dll dynamically
          # links against it; without this next to ft4wsjt.dll, ctypes.CDLL
          # would fail to load it on an end user's machine).
          find "$CONDA_PREFIX/Library/bin" -iname "*fftw3f*.dll" -exec cp {} "$OUT_DIR/" \;
          PKG_NAME="ft4wsjt-windows-x86_64.zip"
          (cd "$OUT_DIR" && 7z a "$RUNNER_TEMP/$PKG_NAME" .)
          echo "PKG=$RUNNER_TEMP/$PKG_NAME" >> "$GITHUB_ENV"
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"

      - name: Upload to ft4wsjt-bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ft4wsjt-bundle \
            --repo "${{ github.repository }}" 2>/dev/null || \
          gh release create ft4wsjt-bundle \
            --repo "${{ github.repository }}" \
            --title "FT4 Enhanced Decoder (libft4wsjt) Bundle" \
            --notes "Pre-built libft4wsjt for FT4 decoding." \
            --prerelease
          gh release upload ft4wsjt-bundle \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ env.PKG }}"

  # ------------------------------------------------------------------ #
  # macOS
  # ------------------------------------------------------------------ #
  build-macos:
    name: Build ft4wsjt (macOS)
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gfortran + FFTW3 + Boost
        run: brew install gcc fftw boost

      - name: Build libft4wsjt
        env:
          WSJTX_TAG: ${{ needs.check-version.outputs.wsjtx_tag }}
        run: |
          ARCH=$(uname -m)
          OUT_DIR=/tmp/ft4wsjt-flat
          FC=$(ls $(brew --prefix gcc)/bin/gfortran-* 2>/dev/null | head -1)
          FC=${FC:-gfortran} ./scripts/build_ft4wsjt.sh "" "$OUT_DIR"
          echo "${WSJTX_TAG}" > "$OUT_DIR/version.txt"

          PKG_NAME="ft4wsjt-macos-${ARCH}.tar.gz"
          tar -czf "/tmp/${PKG_NAME}" -C /tmp ft4wsjt-flat
          echo "PKG=/tmp/${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"

      - name: Upload to ft4wsjt-bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ft4wsjt-bundle \
            --repo "${{ github.repository }}" 2>/dev/null || \
          gh release create ft4wsjt-bundle \
            --repo "${{ github.repository }}" \
            --title "FT4 Enhanced Decoder (libft4wsjt) Bundle" \
            --notes "Pre-built libft4wsjt for FT4 decoding." \
            --prerelease
          gh release upload ft4wsjt-bundle \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ env.PKG }}"
