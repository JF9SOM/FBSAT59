# ERMINAZ-2V (DP0PQB, AMSAT-DL), not in gr-satellites' own catalog (it only has ERMINAZ-1U). Same design as ERMINAZ-2U, copied from it.
# The downlink is a CCSDS TM transfer frame of 223 octets (RS(255,223) information block, SCID 100)
# carrying one space packet; see src/data/telemetry_formats/98208.json and the SatNOGS erminaz2.ksy.
# Not verified on an IQ recording of our own, but DL7NDR's ground station (community.libre.space
# /t/erminaz-2-digipeaters/15503) decodes ERMINAZ-2 with the same parameters (deviation 4800,
# conventional RS, depth 1, CCSDS scrambler, frame size 223, sync word threshold 4).
name: ERMINAZ-2V
alternative_names:
   - DP0PQB
norad: 98208
data:
   &tlm Telemetry:
     telemetry: erminaz
transmitters:
   9k6 GMSK CCSDS downlink:
     frequency: 145.920e+6
     modulation: FSK
     baudrate: 9600
     deviation: 4800
     framing: CCSDS Reed-Solomon
     frame size: 223
     RS basis: conventional
     RS interleave depth: 1
     scrambler: CCSDS
     syncword threshold: 4
     data:
     - *tlm
